name: 정리본 자동 재검토 (대시보드 트리거 / 수동 실행)

on:
  workflow_dispatch:  # 대시보드에 재검토 버튼을 만들면 그 버튼이 이 트리거를 호출한다.
                       # 연동 방법은 auto-ocr.yml과 동일한 패턴 - DASHBOARD_INTEGRATION.md 참고.
                       # Actions 탭에서 사람이 수동으로 Run workflow를 눌러도 똑같이 동작한다.
    inputs:
      dry_run:
        description: "true로 두면 실제로 시트를 고치지 않고 뭘 고칠지만 로그로 보여준다 (점검용)"
        required: false
        default: "false"

# main.py OCR 실행과 같은 스프레드시트를 다루므로, 새 사진을 읽어들이는 중에
# 이 재검토가 동시에 도는 걸 막는다 - 같은 concurrency 그룹을 써서 항상
# 하나씩만 돌게 한다 (먼저 시작한 쪽이 끝날 때까지 다음 실행은 대기).
concurrency:
  group: ocr-to-sheets
  cancel-in-progress: false

jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python review_and_fix.py
        env:
          # SHEET_NAME 외 나머지 시트 이름(TRADERS_SHEET_NAME/CATEGORY_SHEET_NAME_*)은
          # auto-ocr.yml에도 없는 시크릿이라 main.py 쪽 기본값을 그대로 쓴다 - 여기서
          # 빈 문자열로 덮어쓰면 오히려 그 기본값이 깨지므로 일부러 안 넣는다.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
