name: AI 분류 제안 / 월간 SKU 비교 (Gemini)

on:
  workflow_dispatch:  # Actions 탭에서 수동 실행. 대시보드에 별도 버튼을 연동할 수도 있음.
    inputs:
      retailer:
        description: "대상 리테일러"
        required: true
        default: "costco"
        type: choice
        options: [costco, traders]
      run_classify:
        description: "미분류 상품 AI 분류 제안 실행"
        required: true
        default: true
        type: boolean
      run_comparison:
        description: "월간 SKU 비교 실행 (최소 2개월치 정리본 탭 필요)"
        required: true
        default: true
        type: boolean
  workflow_run:
    # "코스트코 라벨 OCR 실행" 워크플로우(코스트코/트레이더스, 상품카드/뒷면 라벨 전체)가
    # 끝나면 자동으로 이어서 실행. 이 워크플로우 하나가 두 리테일러를 모두 처리하므로
    # 아래에서도 두 리테일러를 모두 돈다. OCR이 실패/취소된 실행이면 건너뛴다(잡 단계에서 체크).
    workflows: ["코스트코 라벨 OCR 실행 (대시보드 트리거 / 수동 실행)"]
    types: [completed]

concurrency:
  group: ai-analysis
  cancel-in-progress: false

jobs:
  ai-analysis:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        retailer: ${{ github.event_name == 'workflow_run' && fromJSON('["costco", "traders"]') || fromJSON(format('["{0}"]', github.event.inputs.retailer)) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 미분류 상품 AI 분류 제안
        if: github.event_name == 'workflow_run' || github.event.inputs.run_classify == 'true'
        run: python classify_unclassified.py --retailer "${{ matrix.retailer }}"
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 월간 SKU 비교 + AI 종합 해석
        if: github.event_name == 'workflow_run' || github.event.inputs.run_comparison == 'true'
        run: python monthly_comparison.py --retailer "${{ matrix.retailer }}"
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
